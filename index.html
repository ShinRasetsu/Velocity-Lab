<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velocity-Lab Telemetry</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #050505;
            color: #ffffff;
            overscroll-behavior: none;
            user-select: none;
            touch-action: none;
        }

        .lcd-text {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.05em;
        }

        .neon-accent { text-shadow: 0 0 10px rgba(0, 255, 136, 0.5); }
        .neon-warning { text-shadow: 0 0 10px rgba(255, 170, 0, 0.5); }
        .neon-danger { text-shadow: 0 0 10px rgba(255, 51, 102, 0.5); }
        .neon-blue { text-shadow: 0 0 10px rgba(0, 191, 255, 0.5); }
        .neon-purple { text-shadow: 0 0 10px rgba(187, 134, 252, 0.5); }

        .metric-card {
            background-color: rgba(17, 24, 39, 0.5);
            padding: 0.5rem;
            border-radius: 0.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        
        /* Optimization: Use CSS will-change for high-frequency repaint nodes */
        #speed-display { will-change: contents; }
        #speed-bar { will-change: width; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between p-4 overflow-hidden">

    <header class="w-full flex justify-between items-start text-xs text-gray-500 uppercase font-bold tracking-widest mt-2">
        <div class="flex flex-col gap-1">
            <span id="status-indicator" class="text-yellow-500 neon-warning">ACQUIRING L1/L5...</span>
            <span id="accuracy-display">ACC: -- m</span>
        </div>

        <div class="flex flex-col gap-2 items-center">
            <button id="pwa-install-btn" style="display:none;"
                class="flex items-center gap-1.5 px-3 py-1 rounded border border-[#00ff88]/50 bg-[#00ff88]/10 text-[#00ff88] text-[0.65rem] font-bold tracking-widest uppercase neon-accent transition-all hover:bg-[#00ff88]/20">
                ⬇ INSTALL
            </button>
            <button id="calibrate-btn" 
                class="flex items-center gap-1.5 px-3 py-1 rounded border border-[#00bfff]/50 bg-[#00bfff]/10 text-[#00bfff] text-[0.65rem] font-bold tracking-widest uppercase neon-blue transition-all hover:bg-[#00bfff]/20 active:bg-[#00bfff]/40">
                ⌖ TARE MOUNT
            </button>
            <button id="export-csv-btn" style="display:none;"
                class="flex items-center gap-1.5 px-3 py-1 rounded border border-[#bb86fc]/50 bg-[#bb86fc]/10 text-[#bb86fc] text-[0.65rem] font-bold tracking-widest uppercase neon-purple transition-all hover:bg-[#bb86fc]/20 active:bg-[#bb86fc]/40">
                💾 EXPORT CSV (<span id="log-count">0</span>)
            </button>
        </div>

        <div class="flex flex-col items-end gap-1">
            <span id="update-rate" class="text-[#00ff88] neon-accent">L1/L5 FUSION</span>
            <span id="wake-lock-status" class="text-red-500 neon-danger">WAKELOCK: OFF</span>
        </div>
    </header>

    <main class="flex flex-col items-center justify-center flex-1 w-full">
        <div class="relative flex items-baseline">
            <span id="speed-display" class="text-[7rem] sm:text-[12rem] font-extrabold leading-none lcd-text neon-accent text-[#00ff88]">0.0</span>
            <span class="text-2xl sm:text-4xl font-bold text-gray-400 ml-2 mb-4 sm:mb-8">km/h</span>
        </div>
        
        <div class="w-full max-w-md h-2 bg-gray-900 rounded-full mt-6 overflow-hidden relative">
            <div id="speed-bar" class="absolute top-0 left-0 h-full bg-[#00ff88] w-0 transition-all duration-75 ease-linear"></div>
        </div>
    </main>

    <!-- Professional VBOX-Style Telemetry Matrix -->
    <footer class="w-full grid grid-cols-3 gap-2 border-t border-gray-800 pt-4 mb-2 text-center h-auto">
        <!-- Performance Timers -->
        <div class="metric-card">
            <span class="text-gray-500 text-[0.55rem] uppercase font-bold tracking-wider mb-1">0-100 km/h</span>
            <span id="timer-0-100" class="text-lg font-bold text-[#00bfff] lcd-text">--.--- s</span>
        </div>
        <div class="metric-card">
            <span class="text-gray-500 text-[0.55rem] uppercase font-bold tracking-wider mb-1">100-200 km/h</span>
            <span id="timer-100-200" class="text-lg font-bold text-[#bb86fc] lcd-text">--.--- s</span>
        </div>
        <div class="metric-card">
            <span class="text-gray-500 text-[0.55rem] uppercase font-bold tracking-wider mb-1">1/4 Mile (402m)</span>
            <span id="timer-quarter" class="text-lg font-bold text-yellow-400 lcd-text">--.--- s</span>
        </div>

        <!-- Kinematics -->
        <div class="metric-card">
            <span class="text-gray-500 text-[0.6rem] uppercase font-bold tracking-wider mb-1">Lat G</span>
            <span id="lat-g" class="text-lg font-bold text-white lcd-text">0.00</span>
        </div>
        <div class="metric-card">
            <span class="text-gray-500 text-[0.6rem] uppercase font-bold tracking-wider mb-1">Long G</span>
            <span id="long-g" class="text-lg font-bold text-white lcd-text">0.00</span>
        </div>
        <div class="metric-card">
            <span class="text-gray-500 text-[0.6rem] uppercase font-bold tracking-wider mb-1">Peak G</span>
            <span id="peak-g" class="text-lg font-bold text-[#00ff88] lcd-text">0.00</span>
        </div>
    </footer>

    <script>
        // -----------------------------------------------------------------------------
        // SYSTEM CONFIGURATION & CONSTANTS
        // -----------------------------------------------------------------------------
        const MS_TO_KMPH = 3.6;
        const BAR_MAX_SPEED = 200.0;
        const GRAVITY_MS2 = 9.80665;
        const QUARTER_MILE_METERS = 402.336;
        const MAX_LOG_SAMPLES = 100000; // GC & OOM Failsafe
        
        // Sensor Fusion Parameters
        const IMU_ALPHA = 0.15; 
        const SPEED_ZERO_SNAP_THRESHOLD_KMPH = 1.5;

        // -----------------------------------------------------------------------------
        // STATE MANAGEMENT (Optimized Variable Typings)
        // -----------------------------------------------------------------------------
        let wakeLock = null;
        
        // Kinematic Variables (Physics Engine)
        let fusedSpeedMs = 0.0;
        let distanceMeters = 0.0;
        let lastGpsTime = performance.now();
        let lastImuTime = performance.now();
        
        // Render Throttlers
        let lastSecondaryUiTime = 0;
        let lastLogTime = 0;

        // G-Force & Calibration
        let filteredAccelX = 0.0; 
        let filteredAccelZ = 0.0; 
        let mountOffsetX = 0.0; 
        let mountOffsetZ = 0.0; 
        let longGForce = 0.0;
        let latGForce = 0.0;
        let peakG = 0.0;

        // Performance Timers
        let timer0_100 = { state: 'IDLE', start: 0, result: 0 };
        let timer100_200 = { state: 'IDLE', start: 0, result: 0 };
        let timerQuarter = { state: 'IDLE', start: 0, result: 0 };

        // Pre-Serialized Data Logging (Heap Memory Optimization)
        let telemetrySession = [];
        let isLogging = false;

        // -----------------------------------------------------------------------------
        // DOM ELEMENT CACHING
        // -----------------------------------------------------------------------------
        const dom = {
            speedDisplay: document.getElementById('speed-display'),
            accuracy: document.getElementById('accuracy-display'),
            status: document.getElementById('status-indicator'),
            speedBar: document.getElementById('speed-bar'),
            wakeLock: document.getElementById('wake-lock-status'),
            longG: document.getElementById('long-g'),
            latG: document.getElementById('lat-g'),
            peakG: document.getElementById('peak-g'),
            t0_100: document.getElementById('timer-0-100'),
            t100_200: document.getElementById('timer-100-200'),
            tQuarter: document.getElementById('timer-quarter'),
            installBtn: document.getElementById('pwa-install-btn'),
            calibrateBtn: document.getElementById('calibrate-btn'),
            exportCsvBtn: document.getElementById('export-csv-btn'),
            logCount: document.getElementById('log-count')
        };

        const domCache = {
            speed: null, speedBar: null, longG: null, latG: null, peakG: null, 
            t0_100: null, t100_200: null, tQuarter: null, logs: 0
        };

        // -----------------------------------------------------------------------------
        // CALIBRATION ROUTINE (TARE)
        // -----------------------------------------------------------------------------
        dom.calibrateBtn.addEventListener('click', () => {
            mountOffsetX = filteredAccelX;
            mountOffsetZ = filteredAccelZ;
            
            dom.calibrateBtn.textContent = "✔ TARE OK";
            dom.calibrateBtn.className = "flex items-center gap-1.5 px-3 py-1 rounded border border-[#00ff88]/50 bg-[#00ff88]/20 text-[#00ff88] text-[0.65rem] font-bold tracking-widest uppercase neon-accent";
            
            setTimeout(() => {
                dom.calibrateBtn.textContent = "⌖ TARE MOUNT";
                dom.calibrateBtn.className = "flex items-center gap-1.5 px-3 py-1 rounded border border-[#00bfff]/50 bg-[#00bfff]/10 text-[#00bfff] text-[0.65rem] font-bold tracking-widest uppercase neon-blue transition-all hover:bg-[#00bfff]/20 active:bg-[#00bfff]/40";
            }, 2000);
        });

        // -----------------------------------------------------------------------------
        // CSV TELEMETRY EXPORT (Memory Efficient Generator)
        // -----------------------------------------------------------------------------
        dom.exportCsvBtn.addEventListener('click', () => {
            if (telemetrySession.length === 0) return;
            
            // Re-join pre-serialized strings. Avoids heavy object traversal overhead.
            const header = "Timestamp(ms),Speed(kmh),Distance(m),LatG,LongG\n";
            const csvContent = "data:text/csv;charset=utf-8," + header + telemetrySession.join("\n");

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `VelocityLab_Pro_Telemetry_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // -----------------------------------------------------------------------------
        // PWA BOOTSTRAP
        // -----------------------------------------------------------------------------
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
                    navigator.serviceWorker.register('sw.js').catch(() => {});
                }
            });
        }

        let deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
            dom.installBtn.style.display = 'flex';
        });

        dom.installBtn.addEventListener('click', async () => {
            if (!deferredInstallPrompt) return;
            deferredInstallPrompt.prompt();
            const { outcome } = await deferredInstallPrompt.userChoice;
            if (outcome === 'accepted') dom.installBtn.style.display = 'none';
            deferredInstallPrompt = null;
        });

        window.addEventListener('appinstalled', () => dom.installBtn.style.display = 'none');

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    dom.wakeLock.textContent = "WAKELOCK: ON";
                    dom.wakeLock.className = "text-green-500 neon-accent";
                    wakeLock.addEventListener('release', () => {
                        dom.wakeLock.textContent = "WAKELOCK: LOST";
                        dom.wakeLock.className = "text-red-500 neon-danger";
                    });
                } catch (err) {
                    dom.wakeLock.textContent = "WAKELOCK: N/A";
                    dom.wakeLock.className = "text-gray-500";
                }
            }
        }
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') await requestWakeLock();
        });

        // -----------------------------------------------------------------------------
        // SENSOR FUSION ENGINE (Strict Hardware Polling - Decoupled from Frame Rate)
        // -----------------------------------------------------------------------------
        function handleMotion(event) {
            const now = performance.now();
            const dt = (now - lastImuTime) / 1000.0;
            lastImuTime = now;

            const rawX = event.accelerationIncludingGravity.x || 0;
            const rawZ = event.accelerationIncludingGravity.z || 0;

            // Low Pass Filter
            filteredAccelX = (IMU_ALPHA * rawX) + ((1 - IMU_ALPHA) * filteredAccelX);
            filteredAccelZ = (IMU_ALPHA * rawZ) + ((1 - IMU_ALPHA) * filteredAccelZ);

            // Kinematic Output Updates (Shared globally with Render Loop)
            const kinematicZ = filteredAccelZ - mountOffsetZ;
            longGForce = kinematicZ / GRAVITY_MS2;
            latGForce = (filteredAccelX - mountOffsetX) / GRAVITY_MS2;
            
            // Physics Engine: Integrate Acceleration -> Velocity -> Distance
            fusedSpeedMs += (kinematicZ * dt);
            
            // Zero Velocity State Bounds
            if (fusedSpeedMs < 0) {
                fusedSpeedMs = 0;
            } else if ((fusedSpeedMs * MS_TO_KMPH) >= SPEED_ZERO_SNAP_THRESHOLD_KMPH) {
                // Only integrate physical distance if actually moving, prevents GPS/IMU standing wander
                distanceMeters += (fusedSpeedMs * dt);
            }
        }

        // -----------------------------------------------------------------------------
        // GNSS L1/L5 ABSOLUTE CORRECTION (1Hz Drift Sync)
        // -----------------------------------------------------------------------------
        function onPositionSuccess(position) {
            const coords = position.coords;
            const speedMs = coords.speed || 0.0;
            
            // Soft Kalman-lite drift correction.
            // Decouples massive IMU integration errors smoothly without snapping the display.
            const errorDelta = Math.abs(speedMs - fusedSpeedMs);
            if (errorDelta > 2.0) {
                fusedSpeedMs = speedMs; 
            } else {
                fusedSpeedMs = (fusedSpeedMs * 0.2) + (speedMs * 0.8); 
            }
            
            lastGpsTime = performance.now();
            isLogging = true;

            dom.accuracy.textContent = `ACC: ${coords.accuracy.toFixed(1)} m`;
            if (coords.accuracy <= 4.0) {
                dom.status.textContent = "L1/L5 GNSS: RTK LEVEL";
                dom.status.className = "text-[#bb86fc] neon-purple";
            } else if (coords.accuracy <= 10.0) {
                dom.status.textContent = "L1/L5 GNSS: 3D OK";
                dom.status.className = "text-[#00ff88] neon-accent";
            } else {
                dom.status.textContent = "GNSS: WEAK";
                dom.status.className = "text-yellow-500 neon-warning";
            }
        }

        function onPositionError() {
            dom.status.className = "text-red-500 neon-danger";
            dom.status.textContent = "ERR: NO SIGNAL";
        }

        // Helper function to bypass unnecessary browser reflows
        function updateDOM(element, cacheKey, value, className = null) {
            if (domCache[cacheKey] !== value) {
                element.textContent = value;
                domCache[cacheKey] = value;
            }
            if (className && element.className !== className) {
                element.className = className;
            }
        }

        // -----------------------------------------------------------------------------
        // RENDER LOOP (Prioritized Bifurcated State Machine)
        // -----------------------------------------------------------------------------
        function renderLoop() {
            const now = performance.now();
            let displaySpeedKmph = fusedSpeedMs * MS_TO_KMPH;

            // Zero Snap Deadzone
            if (displaySpeedKmph < SPEED_ZERO_SNAP_THRESHOLD_KMPH && now - lastGpsTime > 1000) {
                displaySpeedKmph = 0.0;
                fusedSpeedMs = 0.0;
            }

            // -------------------------------------------------------------------------
            // TIER 1 PRIORITY (Updates at 120Hz/Max Refresh Rate)
            // -------------------------------------------------------------------------
            const speedStr = displaySpeedKmph.toFixed(1);
            updateDOM(dom.speedDisplay, 'speed', speedStr);
            
            const barPercentage = Math.min((displaySpeedKmph / BAR_MAX_SPEED) * 100, 100).toFixed(1) + "%";
            if (domCache.speedBar !== barPercentage) {
                dom.speedBar.style.width = barPercentage;
                domCache.speedBar = barPercentage;
            }

            // High-Speed Racing Logic
            if (displaySpeedKmph < 2.0) {
                distanceMeters = 0.0; 
                if (timer0_100.state !== 'IDLE' && timer0_100.state !== 'COMPLETED') {
                    timer0_100.state = 'IDLE';
                    updateDOM(dom.t0_100, 't0_100', "READY", "text-lg font-bold text-[#00bfff] lcd-text");
                }
                if (timer100_200.state !== 'IDLE' && timer100_200.state !== 'COMPLETED') {
                    timer100_200.state = 'IDLE';
                    updateDOM(dom.t100_200, 't100_200', "READY", "text-lg font-bold text-[#bb86fc] lcd-text");
                }
                if (timerQuarter.state !== 'IDLE' && timerQuarter.state !== 'COMPLETED') {
                    timerQuarter.state = 'IDLE';
                    updateDOM(dom.tQuarter, 'tQuarter', "READY", "text-lg font-bold text-yellow-400 lcd-text");
                }
            }

            // Timer: 0-100 km/h
            if (timer0_100.state === 'IDLE' && displaySpeedKmph >= 2.0) {
                timer0_100.state = 'RUNNING';
                timer0_100.start = now;
                dom.t0_100.className = "text-lg font-bold text-yellow-400 lcd-text";
            }
            if (timer0_100.state === 'RUNNING' && displaySpeedKmph >= 100.0) {
                timer0_100.state = 'COMPLETED';
                timer0_100.result = now - timer0_100.start;
                updateDOM(dom.t0_100, 't0_100', (timer0_100.result / 1000).toFixed(3) + " s", "text-lg font-bold text-white neon-accent lcd-text");
            }

            // Timer: 100-200 km/h
            if (timer100_200.state === 'IDLE' && displaySpeedKmph >= 100.0) {
                timer100_200.state = 'RUNNING';
                timer100_200.start = now;
                dom.t100_200.className = "text-lg font-bold text-yellow-400 lcd-text";
            }
            if (timer100_200.state === 'RUNNING' && displaySpeedKmph >= 200.0) {
                timer100_200.state = 'COMPLETED';
                timer100_200.result = now - timer100_200.start;
                updateDOM(dom.t100_200, 't100_200', (timer100_200.result / 1000).toFixed(3) + " s", "text-lg font-bold text-white neon-purple lcd-text");
            }

            // Timer: 1/4 Mile 
            if (timerQuarter.state === 'IDLE' && displaySpeedKmph >= 2.0) {
                timerQuarter.state = 'RUNNING';
                timerQuarter.start = now;
                dom.tQuarter.className = "text-lg font-bold text-[#00ff88] lcd-text";
            }
            if (timerQuarter.state === 'RUNNING' && distanceMeters >= QUARTER_MILE_METERS) {
                timerQuarter.state = 'COMPLETED';
                timerQuarter.result = now - timerQuarter.start;
                const trapSpeed = displaySpeedKmph.toFixed(1);
                updateDOM(dom.tQuarter, 'tQuarter', `${(timerQuarter.result / 1000).toFixed(3)}s @ ${trapSpeed}`, "text-[0.9rem] font-bold text-white neon-warning lcd-text");
            }

            // Live Timer Progression Render
            if (timer0_100.state === 'RUNNING') updateDOM(dom.t0_100, 't0_100', ((now - timer0_100.start) / 1000).toFixed(2) + " s");
            if (timer100_200.state === 'RUNNING') updateDOM(dom.t100_200, 't100_200', ((now - timer100_200.start) / 1000).toFixed(2) + " s");
            if (timerQuarter.state === 'RUNNING') updateDOM(dom.tQuarter, 'tQuarter', distanceMeters.toFixed(0) + " m");

            // -------------------------------------------------------------------------
            // TIER 2 PRIORITY (Throttled to 20Hz / 50ms interval for Battery Savings)
            // Human reading comprehension stops scaling past 10-15Hz anyway.
            // -------------------------------------------------------------------------
            if (now - lastSecondaryUiTime >= 50) {
                lastSecondaryUiTime = now;
                
                updateDOM(dom.longG, 'longG', Math.abs(longGForce).toFixed(2) + (longGForce < 0 ? " A" : " B"));
                updateDOM(dom.latG, 'latG', Math.abs(latGForce).toFixed(2));

                const currentPeak = Math.max(Math.abs(longGForce), Math.abs(latGForce));
                if (currentPeak > peakG) {
                    peakG = currentPeak;
                    updateDOM(dom.peakG, 'peakG', peakG.toFixed(2));
                }
            }

            // -------------------------------------------------------------------------
            // TIER 3 PRIORITY (Data Logger - 10Hz Hardware Interval & GC String Array)
            // -------------------------------------------------------------------------
            if (isLogging && displaySpeedKmph > 0 && (now - lastLogTime >= 100)) {
                lastLogTime = now;
                dom.exportCsvBtn.style.display = 'flex';
                
                // Hardcap to prevent RAM OOM browser crash 
                if (telemetrySession.length < MAX_LOG_SAMPLES) {
                    // Pre-serializing strings prevents JSON heap fragmentation overhead
                    const dataRow = `${Math.floor(now)},${speedStr},${distanceMeters.toFixed(2)},${latGForce.toFixed(3)},${longGForce.toFixed(3)}`;
                    telemetrySession.push(dataRow);
                    
                    if (domCache.logs !== telemetrySession.length) {
                        domCache.logs = telemetrySession.length;
                        dom.logCount.textContent = domCache.logs;
                    }
                }
            }

            // Yield thread context and request next frame
            requestAnimationFrame(renderLoop);
        }

        // -----------------------------------------------------------------------------
        // LIFECYCLE INITIALIZATION
        // -----------------------------------------------------------------------------
        function initSensors() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    onPositionSuccess,
                    onPositionError,
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else dom.status.textContent = "ERR: GNSS NOT SUPPORTED";

            if (window.DeviceMotionEvent) {
                window.addEventListener('devicemotion', handleMotion, false);
            } else {
                dom.latG.textContent = "N/A";
                dom.longG.textContent = "N/A";
            }

            requestWakeLock();
            requestAnimationFrame(renderLoop);
        }

        window.addEventListener('load', initSensors);
    </script>
</body>
</html>
